<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reporte Semanal | VISANTIC</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        :root {
            --primary-blue: #058EA6; --light-blue: #e0f2fe; --bg-color: #f8fafc;
            --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
            --danger: #dc2626; --success: #10b981; --warning: #f59e0b;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: white; border-bottom: 1px solid var(--border-color); z-index: 50; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; cursor: pointer; color: var(--text-main); }
        .header-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--primary-blue); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .user-initial { width: 35px; height: 35px; border-radius: 50%; background-color: var(--primary-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .user-dropdown { position: absolute; top: 60px; right: 15px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid var(--border-color); width: 220px; z-index: 1000; display: none; overflow: hidden; }
        .user-dropdown.show { display: block; }
        .user-card { padding: 15px; border-bottom: 1px solid #f1f5f9; }
        .user-meta .user-name { font-weight: 700; font-size: 14px; color: var(--text-main); }
        .user-actions .dropdown-link { display: flex; align-items: center; gap: 8px; padding: 12px 15px; color: var(--danger); font-size: 14px; text-decoration: none; font-weight: 500; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); overflow-y: auto; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        @media (max-width: 768px) { .sidebar { position: fixed; height: calc(100vh - 60px); transform: translateX(-100%); z-index: 40; } .sidebar.open { transform: translateX(0); } .header-title { display: none; } }

        .sidebar-nav { padding: 15px 10px; }
        .sidebar-section { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .sidebar-section:last-child { border-bottom: none; }
        .sidebar .section-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin: 10px 15px; padding-bottom: 0; display: block; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 15px; color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 500; border-radius: 8px; margin-bottom: 2px; transition: all 0.2s; }
        .nav-item:hover { background-color: var(--bg-color); }
        .nav-item.active { background-color: var(--light-blue); color: var(--primary-blue); font-weight: 700; border-left: 4px solid var(--primary-blue); }
        .nav-item.active i { color: var(--primary-blue); }

        .content { flex: 1; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .container { max-width: 900px; margin: 0 auto; padding-bottom: 50px; }
        
        .page-header { margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; text-align: center; }
        .page-header h1 { font-size: 24px; color: var(--primary-blue); margin: 0 0 5px 0; font-weight: 800; text-transform: uppercase; }
        .page-header p { color: var(--text-muted); margin: 0; font-size: 14px; }

        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: #eef1f6; border: none; padding: 10px 20px; border-radius: 25px; font-size: 14px; font-weight: 600; color: #555; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; white-space: nowrap; }
        .tab-btn.active { background: var(--primary-blue) !important; color: #ffffff !important; }
        .tab-badge { background: #d1d5db; color: #555; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .tab-btn.active .tab-badge { background: #ffffff; color: var(--primary-blue); }

        .form-card { background: #FFFFFF; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 24px; padding: 24px; }
        .section-title-form { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; color: var(--primary-blue); margin: 0 0 20px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .section-title-form i { color: var(--primary-blue); }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .form-input, .form-select, textarea.form-input { width: 100%; padding: 14px 16px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; color: var(--text-main); box-sizing: border-box; font-family: inherit; outline: none; transition: all 0.2s ease; }
        .form-input:focus, .form-select:focus, textarea.form-input:focus { background-color: #FFFFFF; border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(5, 142, 166, 0.1); }
        .form-input[readonly] { background-color: #f1f5f9; color: var(--text-muted); cursor: not-allowed; }
        
        .info-grid { display: grid; grid-template-columns: 1fr; gap: 12px; background: var(--light-blue); padding: 16px; border-radius: 8px; border: 1px solid #bae6fd; margin-top: 10px; }
        @media (min-width: 768px) { .info-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .info-grid { grid-template-columns: repeat(3, 1fr); } }
        .info-item label { display: block; font-size: 10px; font-weight: 700; color: var(--primary-blue); text-transform: uppercase; margin-bottom: 2px; }
        .info-item span { display: block; font-size: 13px; color: var(--text-main); font-weight: 500; }

        .photo-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-photo, .btn-photo-secondary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 14px; transition: all 0.2s; }
        .btn-photo { background: var(--primary-blue); color: white; border: none; }
        .btn-photo:hover { background: #046978; }
        .btn-photo-secondary { background: white; color: #374151; border: 1px solid #d1d5db; }
        .photo-grid-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        .photo-slot { aspect-ratio: 1; border: 2px dashed #d1d5db; border-radius: 8px; background: #f9fafb; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
        .remove-photo { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; width: 24px; height: 24px; text-align: center; line-height: 22px; cursor: pointer; font-size: 16px; font-weight: bold; z-index: 10; }

        .signature-container { border: 2px dashed #d1d5db; border-radius: 8px; background: #fafafa; position: relative; margin-bottom: 10px; width: 100%; overflow: hidden; }
        .signature-pad { width: 100%; height: 200px; cursor: crosshair; touch-action: none; display: block; }

        .btn-guardar { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 20px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--success); color: white; border: none; width: 100%; }
        .btn-enviar { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 20px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--primary-blue); color: white; border: none; width: 100%; }

        .modal-enlarger { display: none; position: fixed !important; z-index: 999999 !important; left: 0 !important; top: 0 !important; width: 100vw !important; height: 100vh !important; background-color: rgba(0,0,0,0.95) !important; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-enlarger.show { display: flex !important; }
        .modal-content-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; cursor: zoom-out; }
        #camera-overlay { display: none; position: fixed !important; z-index: 999999 !important; left: 0 !important; top: 0 !important; width: 100vw !important; height: 100vh !important; background-color: rgba(0,0,0,0.95) !important; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        #camera-overlay.show { display: flex !important; }
        #camera-stream { width: 100%; max-width: 600px; aspect-ratio: 4/3; background: black; border-radius: 12px; overflow: hidden; position: relative; }
        #camera-video { width: 100%; height: 100%; object-fit: cover; }
        
        #custom-alert { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-card-alert { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        #alert-icon-container { margin-bottom: 16px; display: flex; justify-content: center; }
        #alert-title { margin: 0 0 8px 0; font-size: 18px; color: var(--text-main); font-weight: 700; }
        #alert-msg { margin: 0 0 24px 0; font-size: 13px; color: var(--text-muted); line-height: 1.5; text-align: left; }
        #alert-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; color: white; background: var(--primary-blue); font-weight: 700; font-size: 14px; cursor: pointer; }

        .data-table-container { background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        thead { background: var(--light-blue); border-bottom: 1px solid var(--border-color); }
        th, td { padding: 12px 15px; font-size: 14px; color: var(--text-main); }
        tbody tr { border-bottom: 1px solid #f1f5f9; }
        .btn-edit { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
        .btn-pdf { background: var(--primary-blue); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="toggle-menu"><i data-lucide="menu"></i></button>
            <img src="https://i.ibb.co/8ng1078m/LOGOTIPO.png" alt="Logo VISANTIC" style="height: 35px; object-fit: contain;">
            <h1 class="header-title">Reporte Semanal</h1>
        </div>
        <div class="header-right">
            <div class="user-initial" id="user-initial-header" onclick="document.getElementById('user-dropdown').classList.toggle('show')">U</div>
            <img src="https://i.ibb.co/8ng1078m/LOGOTIPO.png" alt="User" height="35" style="border-radius:4px;">
            <div class="user-dropdown" id="user-dropdown">
                <div class="user-card"><div class="user-meta"><div class="user-name" id="user-dropdown-name">Cargando...</div></div></div>
                <div class="user-actions"><a href="index.html" class="dropdown-link" onclick="localStorage.clear();"><i data-lucide="log-out" style="width:16px;"></i> Cerrar sesión</a></div>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">
            <div class="container">
                
                <div class="page-header">
                    <h1 id="welcome-username-display">Residente</h1>
                    <p>Registrar y gestionar reportes de obra</p>
                </div>

                <div class="tabs-container">
                    <button class="tab-btn active" onclick="cambiarTab('Nuevo reporte')" id="tab-Nuevo reporte"><i data-lucide="plus-circle" style="width: 16px;"></i> Nuevo reporte</button>
                    <button class="tab-btn" onclick="cambiarTab('Guardados')" id="tab-Guardados">Guardados <span class="tab-badge" id="badge-Borrador">0</span></button>
                    <button class="tab-btn" onclick="cambiarTab('Realizados')" id="tab-Realizados">Realizados <span class="tab-badge" id="badge-Realizado">0</span></button>
                </div>

                <div id="dashboard-ordenes" style="display: none;">
                    <div class="data-table-container">
                        <table>
                            <thead><tr><th>Folio</th><th>Proyecto / Obra</th><th>Fecha</th><th>Acción</th></tr></thead>
                            <tbody id="tabla-mis-ordenes"><tr><td colspan="4" style="padding: 30px; color: var(--text-muted);">Cargando...</td></tr></tbody>
                        </table>
                    </div>
                </div>

                <form id="ordenMttoForm" style="display: block;">
                    
                    <div class="form-card" style="border-left: 4px solid var(--primary-blue);">
                        <h3 class="section-title-form"><i data-lucide="briefcase"></i> Información General</h3>
                        <div class="form-group">
                            <label class="form-label">Proyecto</label>
                            <input class="form-input" id="sucursal-input" list="sucursales-list" placeholder="Escribe o selecciona el proyecto..." autocomplete="off">
                            <datalist id="sucursales-list"></datalist>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Ubicación (Dirección de obra)</label>
                            <input type="text" class="form-input" id="ubicacion-input" placeholder="Captura la dirección de la obra" value="">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Folio</label>
                            <input type="text" class="form-input" id="folio_rs" value="" readonly placeholder="Se generará automáticamente al guardar">
                            <div id="sucursal-details" class="info-grid" style="display:none;">
                                <div class="info-item"><label>Dirección</label><span id="suc-dir"></span></div>
                                <div class="info-item"><label>Ciudad</label><span id="suc-city"></span></div>
                            </div>
                            <input type="hidden" id="doc_id_actual">
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="image-off"></i> Evidencia Fotográfica - ANTES</h3>
                        <label class="form-label">Fotos del estado anterior (Máx 3)</label>
                        <div class="photo-controls">
                            <button type="button" class="btn-photo" onclick="triggerCamera('antes')"><i data-lucide="camera"></i> Toma Foto</button>
                            <button type="button" class="btn-photo-secondary" onclick="triggerFile('antes')"><i data-lucide="upload"></i> Subir Archivo</button>
                        </div>
                        <div id="photoGridAntes" class="photo-grid-slots">
                            <div class="photo-slot" id="slot-antes-0"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-antes-1"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-antes-2"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="hard-hat"></i> Avance de Obra</h3>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <textarea class="form-input" id="desc_falla" rows="3" placeholder="Describe el avance o trabajo realizado..."></textarea>
                        </div>
                        <label class="form-label">Evidencia Fotográfica (Avance - Máx 3)</label>
                        <div class="photo-controls">
                            <button type="button" class="btn-photo" onclick="triggerCamera('falla')"><i data-lucide="camera"></i> Toma Foto</button>
                            <button type="button" class="btn-photo-secondary" onclick="triggerFile('falla')"><i data-lucide="upload"></i> Subir Archivo</button>
                        </div>
                        <div id="photoGridFalla" class="photo-grid-slots">
                            <div class="photo-slot" id="slot-falla-0"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-falla-1"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-falla-2"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="clipboard-check"></i> Observaciones / Materiales</h3>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <textarea class="form-input" id="desc_solucion" rows="3" placeholder="Materiales utilizados, pendientes, observaciones..."></textarea>
                        </div>
                        <label class="form-label">Evidencia Fotográfica (Materiales/Sitio - Máx 3)</label>
                        <div class="photo-controls">
                            <button type="button" class="btn-photo" onclick="triggerCamera('solucion')"><i data-lucide="camera"></i> Toma Foto</button>
                            <button type="button" class="btn-photo-secondary" onclick="triggerFile('solucion')"><i data-lucide="upload"></i> Subir Archivo</button>
                        </div>
                        <div id="photoGridSolucion" class="photo-grid-slots">
                            <div class="photo-slot" id="slot-solucion-0"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-solucion-1"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-solucion-2"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="user"></i> Residente Asignado</h3>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label class="form-label">Nombre del residente en sitio</label>
                            <input type="text" class="form-input" id="nombre_tecnico" placeholder="Escribe el nombre...">
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label class="form-label">Celular del residente</label>
                            <input type="tel" class="form-input" id="celular_tecnico" placeholder="10 dígitos">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Comentario de salida</label>
                            <textarea class="form-input" id="comentario_salida" rows="2" placeholder="Observaciones finales..."></textarea>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="user-check"></i> Selfie en Sitio</h3>
                        <label class="form-label">Evidencia Fotográfica (Selfie - Máx 1)</label>
                        <div class="photo-controls">
                            <button type="button" class="btn-photo" onclick="triggerCamera('selfie')"><i data-lucide="camera"></i> Toma Foto</button>
                            <button type="button" class="btn-photo-secondary" onclick="triggerFile('selfie')"><i data-lucide="upload"></i> Subir Archivo</button>
                        </div>
                        <div style="display: flex; justify-content: center; margin-top: 15px;">
                            <div class="photo-slot" id="slot-selfie-0" style="width: 150px; height: 150px;"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="pen-tool"></i> Firma Táctil</h3>
                        <div class="form-group">
                            <div class="signature-container"><canvas id="firma_tecnico" class="signature-pad"></canvas></div>
                            <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
                                <button type="button" onclick="limpiarFirma('firma_tecnico')" style="padding: 6px 12px; font-size: 13px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-color); background: white; color: var(--text-main); cursor:pointer;">
                                    <i data-lucide="eraser" style="width: 14px; height: 14px;"></i> Limpiar
                                </button>
                            </div>
                            <input type="hidden" id="firma_tecnico_data">
                        </div>
                    </div>

                    <div style="height: 6px; background-color: var(--primary-blue); width: 100%; border-radius: 6px; margin-top: 35px; margin-bottom: 25px;"></div>

                    <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px; max-width: 400px; margin-left: auto; margin-right: auto; padding-bottom: 40px;">
                        <button type="button" id="btn-guardar-borrador" class="btn-guardar" onclick="procesarOrden('Borrador')"><i data-lucide="save"></i> Guardar Reporte</button>
                        <button type="button" id="btn-enviar-orden" class="btn-enviar" onclick="procesarOrden('En proceso')"><i data-lucide="send"></i> Enviar Reporte</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <input type="file" id="fileInputGlobal" accept="image/*" style="display:none" onchange="processFile(this)">
    <canvas id="tempCanvas" style="display:none"></canvas>
    <div id="camera-overlay">
        <div id="camera-stream"><video id="camera-video" autoplay="true" playsinline></video></div>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button onclick="closeCamera()" style="padding:10px 20px; border-radius:6px; border:1px solid #d1d5db; background:white; cursor:pointer; font-weight:bold;">Cerrar</button>
            <button onclick="switchCamera()" style="padding:10px 20px; border-radius:6px; border:1px solid #d1d5db; background:#f3f4f6; cursor:pointer; font-weight:bold;"><i data-lucide="refresh-cw"></i> Girar</button>
            <button onclick="captureFoto()" style="padding:10px 20px; border-radius:6px; background:var(--primary-blue); color:white; border:none; cursor:pointer; font-weight:bold;">Capturar</button>
        </div>
    </div>
    <div id="photoModal" class="modal-enlarger" onclick="closePhotoModal()"><img class="modal-content-img" id="imgFull"></div>
    <div id="custom-alert"><div class="modal-card-alert"><div id="alert-icon-container"></div><h3 id="alert-title"></h3><p id="alert-msg"></p><button id="alert-btn" onclick="closeCustomAlert()">Aceptar</button></div></div>

    <script>
        // Configuración de Firebase actualizada
        const firebaseConfig = {
            apiKey: "AIzaSyBjlemFwGQbA3mM7UhOZAVGaam1z1Xixr8",
            authDomain: "loretoapp-2ca14.firebaseapp.com",
            projectId: "loretoapp-2ca14",
            storageBucket: "loretoapp-2ca14.firebasestorage.app",
            messagingSenderId: "794212467801",
            appId: "1:794212467801:web:f0bf6fd01579f0aec35d48"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let misOrdenes = [], tabActual = 'Nuevo reporte', appDataLoreto = { nombre: 'Residente', usuario: 'demo' };

        document.addEventListener('DOMContentLoaded', () => {
            const usuario = localStorage.getItem('usuario'), nombre = localStorage.getItem('nombre');
            if (!usuario) { window.location.href = 'index.html'; return; }
            appDataLoreto.usuario = usuario; appDataLoreto.nombre = nombre || 'Residente';
            document.getElementById('user-initial-header').innerText = appDataLoreto.nombre.charAt(0).toUpperCase();
            document.getElementById('welcome-username-display').innerText = appDataLoreto.nombre.toUpperCase();
            document.getElementById('user-dropdown-name').innerText = appDataLoreto.nombre;
            document.getElementById('nombre_tecnico').value = appDataLoreto.nombre;

            fetch('menu.html?v=3').then(res => res.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html; lucide.createIcons();
                const linkInicio = document.getElementById('link-inicio'); if(linkInicio) linkInicio.classList.remove('active');
                const linkReporte = document.getElementById('link-reporte-semanal'); if(linkReporte) linkReporte.classList.add('active');
            }).catch(() => {
                document.getElementById('sidebar').innerHTML = `<nav class="sidebar-nav"><div class="sidebar-section"><span class="section-title">Navegación</span><a href="#" class="nav-item active" id="link-reporte-semanal"><i data-lucide="file-text" style="width:18px;height:18px;"></i> Reporte Semanal</a></div></nav>`;
                lucide.createIcons();
            });

            document.getElementById('toggle-menu').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('open'); });
            window.addEventListener('click', (e) => { if (!e.target.matches('#user-initial-header')) { const dd = document.getElementById('user-dropdown'); if(dd.classList.contains('show')) dd.classList.remove('show'); } });
            inicializarFirma(); mostrarFormularioNuevaOrden(); cargarMisOrdenes(); lucide.createIcons();
        });

        function showCustomAlert(t, m, s=true) {
            const a = document.getElementById('custom-alert');
            document.getElementById('alert-title').innerText = t;
            document.getElementById('alert-msg').innerText = m;
            const i = document.getElementById('alert-icon-container'), b = document.getElementById('alert-btn');
            if(s){ i.innerHTML='<i data-lucide="check-circle" style="width:48px;height:48px;color:var(--success)"></i>'; b.style.background='var(--success)'; }
            else{ i.innerHTML='<i data-lucide="alert-triangle" style="width:48px;height:48px;color:var(--danger)"></i>'; b.style.background='var(--danger)'; }
            a.style.display = 'flex'; lucide.createIcons();
        }
        function closeCustomAlert() { document.getElementById('custom-alert').style.display = 'none'; }

        document.getElementById('sucursal-input').addEventListener('input', function(e) {
            const v = e.target.value, c = document.getElementById('sucursal-details');
            if(v.length > 2) { document.getElementById('suc-dir').innerText = 'Dirección'; document.getElementById('suc-city').innerText = 'Ciudad'; c.style.display = 'grid'; } else { c.style.display = 'none'; }
        });

        function cargarMisOrdenes() {
            db.collection("reportes_semanales").where("residente_id","==",appDataLoreto.usuario).get().then(q => {
                misOrdenes = [];
                q.forEach(d => { misOrdenes.push({ id_doc: d.id, ...d.data() }); });
                misOrdenes.sort((a,b) => (b.fecha_hora_completa||"").localeCompare(a.fecha_hora_completa||""));
                actualizarBadges();
                if(tabActual !== 'Nuevo reporte') renderTablaMisOrdenes();
            }).catch(e => console.error(e.message));
        }

        function actualizarBadges() {
            let b = 0, r = 0;
            misOrdenes.forEach(o => { if(o.estado === 'Borrador') b++; else if(o.estado === 'En proceso') r++; });
            document.getElementById('badge-Borrador').innerText = b;
            document.getElementById('badge-Realizado').innerText = r;
        }

        function cambiarTab(e, isEdit=false) {
            tabActual = e;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const a = document.getElementById(`tab-${e}`); if(a) a.classList.add('active');
            if(e === 'Nuevo reporte') { document.getElementById('dashboard-ordenes').style.display = 'none'; document.getElementById('ordenMttoForm').style.display = 'block'; if(!isEdit) mostrarFormularioNuevaOrden(); }
            else { document.getElementById('ordenMttoForm').style.display = 'none'; document.getElementById('dashboard-ordenes').style.display = 'block'; renderTablaMisOrdenes(); }
        }

        function renderTablaMisOrdenes() {
            const t = document.getElementById('tabla-mis-ordenes'); t.innerHTML = '';
            let f = misOrdenes.filter(o => { if(tabActual === 'Guardados' && o.estado !== 'Borrador') return false; if(tabActual === 'Realizados' && o.estado !== 'En proceso') return false; return true; });
            if(f.length === 0) { t.innerHTML = `<tr><td colspan="4" style="padding:30px;color:var(--text-muted)">Sin reportes en esta sección</td></tr>`; return; }
            f.forEach(o => {
                let a = o.estado === 'Borrador' ? `<button type="button" onclick="cargarBorrador('${o.id_doc}')" class="btn-edit"><i data-lucide="edit-2" style="width:14px"></i> Editar</button>` : `<button type="button" onclick="verPDFOrden('${o.id_doc}')" class="btn-pdf"><i data-lucide="file-text" style="width:14px"></i> PDF</button>`;
                const r = document.createElement('tr');
                r.innerHTML = `<td style="font-weight:bold">${o.id_ticket||''}</td><td>${o.proyecto||''}</td><td>${o.fecha_creacion||''}</td><td>${a}</td>`;
                t.appendChild(r);
            });
            lucide.createIcons();
        }

        async function obtenerFolioGlobal() {
            const r = db.collection('metadata').doc('contadores_loreto');
            return await db.runTransaction(async t => { const d = await t.get(r); let n = (d.exists && d.data().rs_folio) ? d.data().rs_folio + 1 : 1; t.set(r, { rs_folio: n }, { merge: true }); return `RS-${n.toString().padStart(4, '0')}`; });
        }

        let fotos = { antes: [null,null,null], falla: [null,null,null], solucion: [null,null,null], selfie: [null] };

        function mostrarFormularioNuevaOrden() {
            document.getElementById('ordenMttoForm').reset();
            document.getElementById('doc_id_actual').value = '';
            document.getElementById('folio_rs').value = '';
            document.getElementById('sucursal-details').style.display = 'none';
            fotos = { antes: [null,null,null], falla: [null,null,null], solucion: [null,null,null], selfie: [null] };
            renderSlots('antes'); renderSlots('falla'); renderSlots('solucion'); renderSlots('selfie');
            limpiarFirma('firma_tecnico');
            document.getElementById('nombre_tecnico').value = appDataLoreto.nombre || '';
        }

        function cargarBorrador(id) {
            const o = misOrdenes.find(x => x.id_doc === id);
            if(!o) return;
            cambiarTab('Nuevo reporte', true);
            document.getElementById('doc_id_actual').value = o.id_doc;
            document.getElementById('folio_rs').value = o.id_ticket || '';
            document.getElementById('sucursal-input').value = o.proyecto || '';
            document.getElementById('ubicacion-input').value = o.ubicacion || ''; 
            document.getElementById('sucursal-input').dispatchEvent(new Event('input'));
            document.getElementById('desc_falla').value = o.desc_avance || '';
            document.getElementById('desc_solucion').value = o.desc_observaciones || '';
            document.getElementById('nombre_tecnico').value = o.residente_nombre || '';
            document.getElementById('celular_tecnico').value = o.residente_celular || '';
            document.getElementById('comentario_salida').value = o.comentario || '';
            fotos.antes = o.urls_antes && o.urls_antes.length ? [...o.urls_antes] : [null,null,null];
            while(fotos.antes.length < 3) fotos.antes.push(null);
            fotos.falla = o.urls_avance && o.urls_avance.length ? [...o.urls_avance] : [null,null,null];
            while(fotos.falla.length < 3) fotos.falla.push(null);
            fotos.solucion = o.urls_observaciones && o.urls_observaciones.length ? [...o.urls_observaciones] : [null,null,null];
            while(fotos.solucion.length < 3) fotos.solucion.push(null);
            fotos.selfie = o.url_selfie ? [o.url_selfie] : [null];
            renderSlots('antes'); renderSlots('falla'); renderSlots('solucion'); renderSlots('selfie');
            if(o.url_firma) {
                document.getElementById('firma_tecnico_data').value = o.url_firma;
                const img = new Image();
                img.onload = () => { if(ctxFirma) ctxFirma.drawImage(img, 0, 0); };
                img.src = o.url_firma;
            } else { limpiarFirma('firma_tecnico'); }
        }

        async function procesarOrden(est) {
            const g = document.getElementById('btn-guardar-borrador'), e = document.getElementById('btn-enviar-orden');
            let fol = document.getElementById('folio_rs').value;
            const cf = document.getElementById('firma_tecnico'), fv = document.createElement('canvas');
            fv.width = cf.width; fv.height = cf.height;

            if(est === 'En proceso') {
                const s = document.getElementById('sucursal-input').value, d = document.getElementById('desc_falla').value, n = document.getElementById('nombre_tecnico').value;
                if(!s || !d || !n) { showCustomAlert("Atención", "Completa Proyecto, Avance y Residente.", false); return; }
                if(cf.toDataURL() === fv.toDataURL() && !document.getElementById('firma_tecnico_data').value) { showCustomAlert("Atención", "Firma obligatoria para enviar.", false); return; }
            }
            if(cf.toDataURL() !== fv.toDataURL()) document.getElementById('firma_tecnico_data').value = cf.toDataURL();
            g.disabled = true; e.disabled = true; g.innerText = 'Guardando...'; e.innerText = 'Guardando...';

            try {
                if(!fol) { fol = await obtenerFolioGlobal(); document.getElementById('folio_rs').value = fol; }

                const od = {
                    id_ticket: fol,
                    proyecto: document.getElementById('sucursal-input').value || '',
                    ubicacion: document.getElementById('ubicacion-input').value || '',
                    residente_id: appDataLoreto.usuario,
                    residente_nombre: document.getElementById('nombre_tecnico').value || '',
                    residente_celular: document.getElementById('celular_tecnico').value || '',
                    desc_avance: document.getElementById('desc_falla').value || '',
                    desc_observaciones: document.getElementById('desc_solucion').value || '',
                    comentario: document.getElementById('comentario_salida').value || '',
                    fecha_creacion: new Date().toISOString().split('T')[0],
                    fecha_hora_completa: new Date().toISOString(),
                    estado: est,
                    urls_antes: fotos.antes.filter(f => f !== null),
                    urls_avance: fotos.falla.filter(f => f !== null),
                    urls_observaciones: fotos.solucion.filter(f => f !== null),
                    url_selfie: fotos.selfie[0] || null,
                    url_firma: document.getElementById('firma_tecnico_data').value || null
                };

                const did = document.getElementById('doc_id_actual').value || fol;
                await db.collection("reportes_semanales").doc(did).set(od, { merge: true });

                showCustomAlert("Éxito", est === 'Borrador' ? "Reporte guardado." : "Reporte enviado.", true);
                cargarMisOrdenes();
                cambiarTab(est === 'Borrador' ? 'Guardados' : 'Realizados');

            } catch(er) {
                console.error(er);
                let mensaje = er.message;
                if(mensaje.includes("403") || mensaje.includes("PERMISSION_DENIED")) {
                    mensaje += "\n\n⚠️ Ve a Firebase Console → Firestore → Reglas y permite read/write.";
                }
                showCustomAlert("Error", mensaje, false);
            } finally {
                g.disabled = false; e.disabled = false;
                g.innerHTML = '<i data-lucide="save"></i> Guardar Reporte';
                e.innerHTML = '<i data-lucide="send"></i> Enviar Reporte';
                lucide.createIcons();
            }
        }

        function verPDFOrden(id) {
            const orden = misOrdenes.find(x => x.id_doc === id);
            if(!orden) { showCustomAlert("Error", "Reporte no encontrado.", false); return; }

            const datosPDF = {
                proyecto: orden.proyecto || '',
                ubicacion: orden.ubicacion || '',
                folio: orden.id_ticket || '',
                residente_nombre: orden.residente_nombre || '',
                fecha: orden.fecha_creacion || '',
                desc_avance: orden.desc_avance || '',
                desc_observaciones: orden.desc_observaciones || '',
                residente_celular: orden.residente_celular || '',
                comentario: orden.comentario || '',
                fotos_antes: (orden.urls_antes || []).concat([null, null, null]).slice(0, 3),
                fotos_avance: (orden.urls_avance || []).concat([null, null, null]).slice(0, 3),
                fotos_observaciones: (orden.urls_observaciones || []).concat([null, null, null]).slice(0, 3),
                selfie: orden.url_selfie || null,
                firma: orden.url_firma || null
            };

            sessionStorage.setItem('DatosReportePDF', JSON.stringify(datosPDF));
            window.open('pdf_reporte_semanal.html', '_blank');
        }

        let activeTarget = 'falla', currentFacingMode = 'environment';

        function triggerFile(t) { activeTarget = t; if(fotos[t].filter(f => f !== null).length < fotos[t].length) document.getElementById('fileInputGlobal').click(); else window.alert("Límite de fotos."); }

        function processFile(i) {
            if(!i.files || i.files.length === 0) return;
            const r = new FileReader();
            r.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const c = document.createElement('canvas');
                    let w = img.width, h = img.height; const m = 800;
                    if(w > m || h > m) { if(w > h) { h = (h/w)*m; w = m; } else { w = (w/h)*m; h = m; } }
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    const f = c.toDataURL('image/jpeg', 0.7);
                    const s = fotos[activeTarget].findIndex(f => f === null);
                    if(s > -1) { fotos[activeTarget][s] = f; renderSlots(activeTarget); }
                    i.value = '';
                };
                img.src = e.target.result;
            };
            r.readAsDataURL(i.files[0]);
        }

        let currentStream;
        async function triggerCamera(t) { activeTarget = t; if(fotos[t].filter(f => f !== null).length >= fotos[t].length) { window.alert("Límite."); return; } currentFacingMode = (t === 'selfie') ? 'user' : 'environment'; await startCamera(); }
        async function startCamera() {
            if(currentStream) { currentStream.getTracks().forEach(t => t.stop()); }
            try { currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } }); document.getElementById('camera-video').srcObject = currentStream; document.getElementById('camera-overlay').classList.add('show'); }
            catch(e) { window.alert("Cámara no disponible."); }
        }
        function switchCamera() { currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment'; startCamera(); }
        function closeCamera() { if(currentStream) { currentStream.getTracks().forEach(t => t.stop()); } document.getElementById('camera-overlay').classList.remove('show'); }

        function captureFoto() {
            const c = document.getElementById('tempCanvas'), v = document.getElementById('camera-video');
            c.width = v.videoWidth; c.height = v.videoHeight;
            const x = c.getContext('2d');
            if(currentFacingMode === 'user') { x.translate(c.width, 0); x.scale(-1, 1); }
            x.drawImage(v, 0, 0, c.width, c.height); x.setTransform(1, 0, 0, 1, 0, 0);
            const s = fotos[activeTarget].findIndex(f => f === null);
            if(s > -1) { fotos[activeTarget][s] = c.toDataURL('image/jpeg', 0.8); renderSlots(activeTarget); }
            closeCamera();
        }

        function removeFoto(t, i) { fotos[t][i] = null; renderSlots(t); }
        function enlargePhoto(s) { document.getElementById('imgFull').src = s; document.getElementById('photoModal').classList.add('show'); }
        function closePhotoModal() { document.getElementById('photoModal').classList.remove('show'); }

        function renderSlots(t) {
            for(let i = 0; i < fotos[t].length; i++) {
                const s = document.getElementById(`slot-${t}-${i}`); if(!s) continue;
                if(fotos[t][i]) {
                    s.innerHTML = `<img src="${fotos[t][i]}" onclick="enlargePhoto(this.src)" style="width:100%;height:100%;object-fit:cover;cursor:zoom-in;border-radius:8px"><span class="remove-photo" onclick="removeFoto('${t}',${i})">&times;</span>`;
                    s.style.border = "1px solid var(--border-color)";
                } else {
                    s.innerHTML = `<i data-lucide="image" style="color:#ccc;width:30px;height:30px"></i>`;
                    s.style.border = "2px dashed #d1d5db";
                }
            }
            lucide.createIcons();
        }

        let canvasFirma, ctxFirma;
        function inicializarFirma() {
            canvasFirma = document.getElementById('firma_tecnico'); if(!canvasFirma) return;
            ctxFirma = canvasFirma.getContext('2d');
            canvasFirma.width = 600; canvasFirma.height = 200;
            ctxFirma.lineWidth = 3; ctxFirma.lineCap = 'round'; ctxFirma.strokeStyle = '#058EA6';
            let d = false;
            function g(e) {
                const r = canvasFirma.getBoundingClientRect();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: (cx - r.left) * (canvasFirma.width / r.width), y: (cy - r.top) * (canvasFirma.height / r.height) };
            }
            canvasFirma.addEventListener('mousedown', e => { d = true; const p = g(e); ctxFirma.beginPath(); ctxFirma.moveTo(p.x, p.y); });
            canvasFirma.addEventListener('mousemove', e => { if(d) { const p = g(e); ctxFirma.lineTo(p.x, p.y); ctxFirma.stroke(); } });
            window.addEventListener('mouseup', () => { if(d) { d = false; document.getElementById('firma_tecnico_data').value = canvasFirma.toDataURL(); } });
            canvasFirma.addEventListener('touchstart', e => { e.preventDefault(); d = true; const p = g(e); ctxFirma.beginPath(); ctxFirma.moveTo(p.x, p.y); }, { passive: false });
            canvasFirma.addEventListener('touchmove', e => { e.preventDefault(); if(d) { const p = g(e); ctxFirma.lineTo(p.x, p.y); ctxFirma.stroke(); } }, { passive: false });
            window.addEventListener('touchend', () => { if(d) { d = false; document.getElementById('firma_tecnico_data').value = canvasFirma.toDataURL(); } });
        }
        function limpiarFirma(id) { if(ctxFirma) ctxFirma.clearRect(0, 0, canvasFirma.width, canvasFirma.height); document.getElementById(id + '_data').value = ''; }

        document.getElementById('celular_tecnico').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            if(e.target.value.length > 10) e.target.value = e.target.value.slice(0, 10);
        });
    </script>
</body>
</html>
